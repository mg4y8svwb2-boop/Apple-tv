
name: Build Cinema TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - "CinemaTVLauncher_MobileBuild.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -o CinemaTVLauncher_MobileBuild.zip -d extracted
          find extracted -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          ROOT=$(find extracted -name settings.gradle -type f -printf '%h\n' | head -n 1)
          if [ -z "$ROOT" ]; then
            ROOT=$(find extracted -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)
          fi
          if [ -z "$ROOT" ]; then
            echo "Gradle project not found in ZIP"
            exit 1
          fi
          cd "$ROOT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CinemaTV-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
